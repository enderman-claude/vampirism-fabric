name: fabric-build

on:
  push:
    branches: [fabric]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Report javac errors as annotations
        if: always()
        run: python3 scripts/report-errors.py
      - name: Collect player jar only
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          cp build/libs/vampirism-fabric-*.jar dist/ 2>/dev/null || true
          rm -f dist/*-dev.jar dist/*sources*.jar
          ls -la dist
      - name: Upload player jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vampirism-fabric-jar
          path: dist/*.jar
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
