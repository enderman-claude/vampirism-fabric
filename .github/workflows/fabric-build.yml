name: fabric-build

on:
  push:
    branches: [fabric]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Dump Yarn class names (for mapping fixes)
        if: always()
        shell: bash
        run: |
          for j in $(find "$HOME/.gradle/caches/fabric-loom" -name '*.jar' 2>/dev/null); do
            unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E '/(nbt/[A-Za-z]*Compound[A-Za-z]*|[A-Za-z]*Spawner[A-Za-z]*|SpawnHelper|SpawnGroup|[A-Za-z]*Weighted[A-Za-z]*|[A-Za-z]*Weight[A-Za-z]*)\.class$' | sed "s|^|$(basename "$j"): |"
          done | sort -u | head -80 | while IFS= read -r l; do echo "::notice::$l"; done
          exit 0
      - name: Report javac errors as annotations
        if: always()
        run: python3 scripts/report-errors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            build/libs/
            build/reports/
          if-no-files-found: ignore
