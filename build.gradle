// Fabric port scaffold. Versions verified by CI (Loom 0.7.35, Gradle 7.2, Yarn 1.16.5).
plugins {
    id 'fabric-loom' version '0.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Commit hash is injected only when built by CI (GITHUB_SHA set). Local builds get no hash, so none is printed.
def buildCommit = System.getenv('GITHUB_SHA')

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    doLast {
        def out = new File(destinationDir, 'vampirism-build.properties')
        if (buildCommit) {
            out.text = "commit=${buildCommit.take(8)}\n"
        } else {
            out.delete()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

java {
    withSourcesJar()
}
